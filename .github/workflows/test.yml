# SPDX-License-Identifier: GPL-2.0-or-later
# Runs the simulation tests (Verilator testbenches, plus the C, Python
# and shell tests in sim/) on every push and pull request. The same
# command works locally: `make test` from the repo root.
#
# This does not build the FPGA core: that needs Quartus 17.0 (~5 min in
# the ryanfb/quartus-mister Docker image; see README).
name: test

on:
  push:
  pull_request:

jobs:
  sim:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Verilator, compiler, Python/numpy, ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator g++ make python3 python3-numpy ffmpeg
          verilator --version
      - name: make test
        run: make test
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sim-logs
          path: sim/obj_logs/
